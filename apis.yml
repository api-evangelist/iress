apis:
- aid: iress:iress-sourcing-apis
  name: Iress Sourcing APIs
  description: Iress Sourcing APIs bring the UK mortgage and protection sourcing data behind The Exchange, Xplan
    Mortgage and Trigold directly into a CRM, platform or website. Access is arranged with Iress; no public base
    URL is published.
  humanURL: https://www.iress.com/software/sourcing/apis-and-integrations/
  tags:
  - Mortgages
  - Insurance
  - Financial Data
  properties:
  - type: Documentation
    url: https://www.iress.com/software/sourcing/apis-and-integrations/
- aid: iress:xplan-integrations
  name: Xplan Integrations
  description: Xplan Integrations connect Iress Xplan financial advice software to third-party applications, either
    through standard integrations that use an app key with the client's permission or through customised integrations.
  humanURL: https://www.iress.com/software/financial-advice/xplan-integrations/
  tags:
  - Financial Advice
  - Wealth Management
  - Integrations
  properties:
  - type: Documentation
    url: https://www.iress.com/software/financial-advice/xplan-integrations/
- aid: iress:iress-web-services-v4
  name: Iress Web Services V4
  description: Iress Web Services V4 is a SOAP XML document/literal web service used to access IRESS market data
    and Web Admin, IOS+ (Iress Order Management System), IPS (Iress Portfolio System) and FIX+ Administrator. The
    full WSDL and method reference are generated per user behind an IRESS login at webservices.iress.com.au; Iress
    publishes the IRESS and IOS+ WSDLs used by its C# sample in the iress/webservices-v4-docs GitHub repository.
  humanURL: https://github.com/iress/webservices-v4-docs
  baseURL: https://webservices.iress.com.au/v4/SOAP.aspx
  tags:
  - Market Data
  - Trading
  - SOAP
  properties:
  - type: WSDL
    url: wsdl/iress-webservices-v4-iress.wsdl
  - type: WSDL
    url: wsdl/iress-webservices-v4-iosplus.wsdl
  - type: WSDL
    name: WSDL (provider-hosted, IRESS)
    url: https://raw.githubusercontent.com/iress/webservices-v4-docs/main/samples/C%23/iosplus-download/WebServices/Iress.wsdl
  - type: WSDL
    name: WSDL (provider-hosted, IOS+)
    url: https://raw.githubusercontent.com/iress/webservices-v4-docs/main/samples/C%23/iosplus-download/WebServices/IosPlus.wsdl
  - type: Documentation
    url: https://webservices.iress.com.au/v4/

