aid: iress

name: Iress

description: Iress is a technology company providing software to the financial services industry, used by more than
  10,000 businesses and 500,000 users. Its products span financial advice (Xplan and Xplan Integrations), trading
  and market data (Iress Pro, Viewpoint, FIX, order and institutional trading systems, real-time market data from
  100+ markets), investment management, and UK mortgage and protection sourcing (The Exchange, Xplan Mortgage, Trigold),
  whose Sourcing APIs let platforms integrate Iress sourcing data. Iress sold its QuantHouse business (QuantFeed
  market data API) to BAHA Tech Holding AG, and the former QuantFeed page on iress.com now returns 404.

