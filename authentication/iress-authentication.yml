docs: https://community.iress.com/ic/discussion/102962/authentication-overview
description: 'Iress Open (Xplan REST API) authentication. The Swagger contract declares HTTP Basic (Xplan credentials)
  together with two required headers: the integrator API key (x-xplan-app-id) and the target Xplan site (x-forwarded-host).
  The community docs state OAuth 2.0 Authorisation Code Grant is the preferred mechanism and that Basic is supported
  but discouraged. Keys are provisioned by Iress through the Iress API Key Portal (gated).'
schemes:
- name: BasicAuth
  type: http
  scheme: basic
  description: Your XPLAN Credentials
  source: https://api.iressopen.com.au/swagger/3.0/swagger.json
  docs_note: HTTP Basic Authentication is also supported but discouraged due to the necessity to store user credentials.
  two_factor: When 2FA is mandatory the OTP is appended to the password, separated by \n\r\t\u0007, i.e. Base64
    of USER:PASSWORD\n\r\t\u0007OTP; after the session is established use the XPLANID session cookie instead of
    the Authorization header.
  two_factor_source: https://github.com/iress/iress-xplan-api-examples/blob/main/2FA_TECHNICAL_DOC.md
- name: APIKey
