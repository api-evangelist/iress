  description: Target Xplan site to authorise against
  source: https://api.iressopen.com.au/swagger/3.0/swagger.json
- name: OAuth 2.0
  type: oauth2
  flow: authorizationCode
  description: Iress API Keys use OAuth 2.0 (Authorisation Code Grant) as their preferred authentication mechanism.
  session: Once initially established an Xplan session can be maintained for a maximum of one hour before the need
    to re-authenticate.
  refresh: Iress also support a refresh process whereby a new session can be established programmatically
  declared_in_contract: false
  source: https://community.iress.com/ic/discussion/102962/authentication-overview
authorization:
  model: capabilities
  description: Authorisation is managed primarily by capabilities, with one set attached to an API Key working in
    conjunction with those allocated to the Xplan User account connecting to the API.
  source: https://community.iress.com/ic/discussion/102964/access-and-authorisation-overview
